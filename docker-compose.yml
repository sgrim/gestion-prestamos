name: gestion-prestamos

services:
  db:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-prestamos}
      POSTGRES_USER: ${POSTGRES_USER:-prestamos}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-prestamos}
    volumes:
      # PostgreSQL 18+ espera el volumen en /var/lib/postgresql (no en .../data)
      - pgdata:/var/lib/postgresql
    ports:
      - "127.0.0.1:${DB_PORT:-5433}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build: ./backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_URL: jdbc:postgresql://db:5432/${POSTGRES_DB:-prestamos}
      DB_USER: ${POSTGRES_USER:-prestamos}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-prestamos}
      APP_JWT_SECRET: ${APP_JWT_SECRET:-dev-only-secret-change-me-please-32-bytes-min}
      APP_JWT_EXPIRATION: ${APP_JWT_EXPIRATION:-2h}
      APP_SEED_ENABLED: ${APP_SEED_ENABLED:-true}
      APP_SEED_PASSWORD: ${APP_SEED_PASSWORD:-123}
      APP_CORS_ORIGINS: http://localhost:${FRONTEND_PORT:-4200}
    ports:
      - "${BACKEND_PORT:-8081}:8080"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/actuator/health/readiness || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 40s

  frontend:
    build: ./frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "${FRONTEND_PORT:-4200}:80"

volumes:
  pgdata:
