spring:
  application:
    name: prestamos

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/prestamos}
    username: ${DB_USER:prestamos}
    password: ${DB_PASSWORD:prestamos}

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate   # el esquema lo gestiona Flyway; Hibernate solo lo verifica
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

  flyway:
    enabled: true

  cache:
    type: jcache
    jcache:
      config: classpath:ehcache.xml

  jackson:
    default-property-inclusion: non_null

server:
  port: 8080
  error:
    include-message: never
    include-stacktrace: never

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

app:
  jwt:
    # Solo para desarrollo local. En Docker/producción se sobrescribe con APP_JWT_SECRET.
    secret: ${APP_JWT_SECRET:dev-only-secret-change-me-please-32-bytes-min}
    expiration: ${APP_JWT_EXPIRATION:2h}
    issuer: prestamos-api
  cors:
    allowed-origins: ${APP_CORS_ORIGINS:http://localhost:4200}
  seed:
    enabled: ${APP_SEED_ENABLED:true}
    password: ${APP_SEED_PASSWORD:123}
  notifications:
    webhook-url: ${APP_NOTIFICATIONS_WEBHOOK_URL:}

logging:
  level:
    com.makers.prestamos: INFO
